<!-- Chatbot Icon -->
<button type="button" class="chatbot-icon" (click)="toggleChatbot()"
    [attr.aria-label]="isChatbotOpen ? 'Close chat' : 'Open chat'"
    [attr.aria-expanded]="isChatbotOpen" aria-controls="hrm-chat-panel">
    <mat-icon>{{isChatbotOpen ? 'close' : 'chat'}}</mat-icon>
</button>

  <!-- Chatbot Component (conditionally shown) -->
  <app-chatbot id="hrm-chat-panel" *ngIf="isChatbotOpen"></app-chatbot>
