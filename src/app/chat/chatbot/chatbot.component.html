<section class="chat-container" aria-labelledby="chat-heading">
    <h2 id="chat-heading" class="chat-header m-0">Effortless Chatbot</h2>
    <div class="chat-messages" #chatMessages role="log" aria-live="polite" aria-relevant="additions text">
        <div *ngFor="let message of messages" [ngClass]="{'bot': message.sender === 'bot', 'user': message.sender === 'user'}" class="message">
            <div class="message-bubble">
                <div *ngIf="message.text">{{ message.text }}</div>
                <div *ngIf="message.imageUrl">
                    <img [src]="message.imageUrl" alt="Bot image response" style="max-width: 100%; border-radius: 10px; margin-top: 8px; max-height: 200px;" />
                </div>
            </div>
        </div>
        <div *ngIf="isLoading" class="loading-indicator">
            <span>Typing...</span>
        </div>
    </div>
    <div class="chat-input">
        <input 
            type="text" 
            placeholder="Type your message..." 
            aria-label="Message"
            #messageInput 
            (keydown)="onKeyDown($event, messageInput.value)"
        >
        <button type="button" mat-icon-button color="primary" (click)="sendMessage(messageInput.value)" [disabled]="isLoading" matTooltip="Send" aria-label="Send message">
            <mat-icon>send</mat-icon>
        </button>
        <button type="button" mat-icon-button color="primary" (click)="toggleVoiceInput(messageInput)" [disabled]="isLoading" matTooltip="Voice Input" [attr.aria-label]="isRecording ? 'Stop voice input' : 'Start voice input'" [attr.aria-pressed]="isRecording">
            <mat-icon>{{ isRecording ? 'stop_circle' : 'mic' }}</mat-icon>
        </button>
    </div>
</section>
