
    <div class="input-group w-75 mx-auto menu-search mt-3" [class.d-none]="railMenu">
        <span class="input-group-text p-0">
            <mat-icon>search</mat-icon>
        </span>
        <input type="text" [(ngModel)]="searchText" placeholder="Search..." aria-label="Search navigation" class="form-control"
            (input)="filteredMenuItems()">
    </div>

<!--Expanded Menu-->

<nav aria-label="Main navigation">
<ul class="menu mt-3" [class.rail-menu]="railMenu">
    @for(menu of menuList; track menu) {
    <li><a class="menu-item"
        [class.rail-menu-item]="railMenu"
        [routerLink]="menu.url"
        [matTooltip]="railMenu ? menu.title : ''"
        [class.active]="isActive(menu)"
        [attr.aria-current]="isActive(menu) ? 'page' : null"
        [attr.aria-label]="menu.title"
        >
        @if(menu.svgIcon) {
            <mat-icon [svgIcon]="menu.svgIcon"></mat-icon>
        } @else {
            <img class="icon-img" [src]="menu.icon" height="25" alt="">
            <img class="icon-img-light" [src]="menu.lightIcon" height="25" alt="">
        }
        <span> {{menu.title}}</span>
    </a></li>
    }
</ul>
</nav>
