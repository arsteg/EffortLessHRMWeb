<a class="skip-link" href="#page-content-wrapper" (click)="$event.preventDefault(); mainContent.focus()">Skip to content</a>
<app-header [loggedInUser]="currentProfile" [profileSwitch]="portalType?.toLowerCase() === 'admin'" [role]="adminView"
  (onMenuToggled)="toggleDrawer($event)" (onProfileSwitch)="switchView($event)">
</app-header>

<!-- Sidebar - icons with text -->
<div id="wrapper">
  <mat-drawer-container class="content-container" autosize>
    <mat-drawer #drawerRef class="sidenav-drawer" [mode]="isMobile ? 'over' : 'side'"
      (openedChange)="onDrawerOpenedChange($event)" [opened]="!isMobile || isMobile && drawerOpened" [ngClass]="{
      'collapsed': !isMobile && isCollapsedMenu,
      'expanded': !isMobile && !isCollapsedMenu
    }">
      <app-sidebar [menuList]="menuList" [railMenu]="!isMobile && isCollapsedMenu"></app-sidebar>
    </mat-drawer>

    <mat-drawer-content #contentArea>
      <main #mainContent id="page-content-wrapper" tabindex="-1" class="content-wrapper w-100">
        <router-outlet></router-outlet>
      </main>
    </mat-drawer-content>
  </mat-drawer-container>
  <ng-http-loader [backdrop]="false" [backgroundColor]="'#ff0000'" [debounceDelay]="100" [extraDuration]="1000"
    [minDuration]="1000" [backdropBackgroundColor]="'#777777'" [spinner]="spinnerStyle.skThreeBounce">
  </ng-http-loader>
</div>
